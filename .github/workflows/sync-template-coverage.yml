name: Sync Template Coverage Matrix

on:
  push:
    paths:
      - 'Tasmota_Templates/Template_Coverage.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync coverage table into README files
        run: |
          TABLE=$(cat Tasmota_Templates/Template_Coverage.md)

          for FILE in README.md Tasmota_Templates/README.md Documentation/Setup.md; do
            if [ -f "$FILE" ]; then
              python3 - <<EOF
          import re

          with open("$FILE", "r") as f:
              content = f.read()

          table = """$TABLE"""

          pattern = r'(<!-- TEMPLATE_COVERAGE_START -->).*?(<!-- TEMPLATE_COVERAGE_END -->)'
          replacement = r'\1\n' + table + r'\n\2'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("$FILE", "w") as f:
              f.write(new_content)

          print(f"Updated $FILE")
          EOF
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md Tasmota_Templates/README.md Documentation/Setup.md
          git diff --staged --quiet || git commit -m "Auto-sync Template Coverage Matrix"
          git push
          
