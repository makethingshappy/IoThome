<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blakadder Entry Generator — IoThome</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222638; --border: #2e3350;
  --accent: #4f7fff; --accent-dim: #1e2d5a;
  --green: #3ecf8e; --green-dim: #1a4a35; --green-btn: #1a7a4a; --green-btn-hover: #22a060;
  --text: #e2e4ef; --muted: #7b80a0;
  --danger: #f07070; --danger-bg: #1a0f0f;
  --mono: 'JetBrains Mono','Fira Code',monospace;
  --sans: 'Inter',system-ui,sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 14px; }
.logo { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
header h1 { font-size: 15px; font-weight: 600; }
.badge { margin-left: auto; background: var(--accent-dim); color: var(--accent); font-size: 11px; font-weight: 700; padding: 3px 12px; border-radius: 20px; }
.layout { display: grid; grid-template-columns: 1fr 420px; height: calc(100vh - 53px); }
.left { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.status { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 16px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.status.ok { border-color: var(--green-dim); color: var(--green); }
.status.err { border-color: #5a2020; color: var(--danger); background: var(--danger-bg); }
.table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: auto; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--surface2); padding: 10px 12px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: normal; line-height: 1.4; text-align: center; }
th:first-child { text-align: left; white-space: nowrap; }
td { padding: 8px 12px; text-align: center; border-bottom: 1px solid var(--border); color: var(--muted); }
td:first-child { text-align: left; font-weight: 600; color: var(--text); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(79,127,255,.04); }
.btn-tmpl { background: var(--green-btn); color: #fff; border: none; border-radius: 5px; padding: 4px 11px; font-size: 11px; font-weight: 700; cursor: pointer; transition: background .15s, transform .08s; }
.btn-tmpl:hover { background: var(--green-btn-hover); }
.btn-tmpl:active { transform: scale(.95); }
.btn-tmpl.selected { background: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.right { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.right-header { padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.right-header h2 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
.sel-info { font-size: 13px; color: var(--accent); font-weight: 600; min-height: 18px; }
.ctrl { padding: 12px 18px; border-bottom: 1px solid var(--border); }
.ctrl label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
select, input[type="password"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 7px 10px; outline: none; transition: border-color .15s; font-family: var(--sans); }
select:focus, input:focus { border-color: var(--accent); }
select:disabled { opacity: .4; }
.btn-gen { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
.btn-gen:hover { opacity: .85; }
.btn-gen:disabled { opacity: .3; cursor: not-allowed; }
.output-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.block { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.block-header { padding: 7px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.block pre { padding: 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-all; }
.photo-wrap { padding: 12px; text-align: center; }
.photo-wrap img { max-width: 100%; max-height: 160px; border-radius: 6px; border: 1px solid var(--border); }
.photo-name { font-size: 10px; color: var(--muted); margin-top: 6px; font-family: var(--mono); }
.copy-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; transition: border-color .15s, color .15s; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); text-align: center; padding: 40px; }
.empty-icon { font-size: 36px; opacity: .25; }
.empty-text { font-size: 12px; line-height: 1.7; }
.warn { background: #2a1f0a; border: 1px solid #6b4c0a; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #e0a040; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(79,127,255,.25); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <span class="logo">IoThome</span>
  <span style="color:var(--border)">·</span>
  <h1>Blakadder Entry Generator</h1>
  <span class="badge">templates.blakadder.com</span>
</header>

<div class="layout">
  <div class="left">
    <div>
      <div class="section-label">Step 1 — click a Template button</div>
      <div id="status" class="status">
        <span class="spinner" id="spin"></span>
        <span id="statusText">Loading compatibility table…</span>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="tHead"><th>IoTextra module</th></tr></thead>
        <tbody id="tBody"><tr><td colspan="6" style="padding:16px;color:var(--muted)">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="right">
    <div class="right-header">
      <h2>Selected</h2>
      <div class="sel-info" id="selInfo">— click a Template button</div>
    </div>
    <div class="ctrl">
      <label>Version</label>
      <select id="versionSel" disabled><option>— select template first —</option></select>
    </div>
    <div class="ctrl">
      <label>GitHub Token (optional — avoids rate limit)</label>
      <input type="password" id="ghToken" placeholder="ghp_…" style="font-family:var(--mono)">
    </div>
    <div class="ctrl">
      <button class="btn-gen" id="genBtn" disabled onclick="generate()">Generate Blakadder entry</button>
    </div>
    <div class="output-body" id="outputBody">
      <div class="empty">
        <div class="empty-icon">📋</div>
        <div class="empty-text">Click a green <strong>Template</strong> button,<br>select a version, then Generate.</div>
      </div>
    </div>
  </div>
</div>

<script>
const ORG = 'makethingshappy';
const IOTHOME = ORG + '/IoThome';

const MODULE_REPO = {
  'Input':'IoTextra-Digital','Relay2':'IoTextra-Digital','SSR Small':'IoTextra-Digital',
  'MOSFET2':'IoTextra-Digital','Quadro':'IoTextra-Digital',
  'Octal':'IoTextra-Digital','Octal2':'IoTextra-Digital','Octal3':'IoTextra-Digital',
  'Analog':'IoTextra-Analog','Analog2':'IoTextra-Analog','Analog3':'IoTextra-Analog',
  'Combo':'IoTextra-Combo','Combo2':'IoTextra-Combo'
};

const PLATFORM_FILE = {
  'IoTsmart ESP32-S3': 'IoTsmart_ESP32-S3',
  'IoTsmart XIAO + XIAO ESP32-S3': null,
  'IoTbase PICO + Waveshare ESP32-S3-Pico': 'IoTbase_PICO',
  'IoTbase NANO + Waveshare ESP32-S3-NANO': 'IoTbase_Nano',
  'IoTbase Feather + Adafruit ESP32-C6 Feather': 'IoTbase_Feather'
};

let sel = null, selBtn = null;

function ghHeaders() {
  const tok = document.getElementById('ghToken').value.trim();
  const h = { 'Accept': 'application/vnd.github.v3+json' };
  if (tok) h['Authorization'] = 'token ' + tok;
  return h;
}

async function ghRaw(path) {
  const r = await fetch('https://raw.githubusercontent.com/' + path);
  if (!r.ok) throw new Error('Cannot read: ' + path);
  return r.text();
}

async function ghAPI(path) {
  const r = await fetch('https://api.github.com/' + path, { headers: ghHeaders() });
  if (!r.ok) throw new Error('GitHub API ' + r.status + ': ' + path);
  return r.json();
}

function setStatus(msg, state) {
  document.getElementById('status').className = 'status' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  document.getElementById('spin').style.display = state ? 'none' : 'inline-block';
  document.getElementById('statusText').textContent = msg;
}

async function loadTable() {
  try {
    const md = await ghRaw(IOTHOME + '/main/Tasmota_Templates/README.md');
    const m = md.match(/IOTEXTRA_TASMOTA_COMPATIBILITY_START -->([\s\S]*?)<!--\s*IOTEXTRA_TASMOTA_COMPATIBILITY_END/);
    if (!m) throw new Error('Compatibility section not found');

    const lines = m[1].split('\n').filter(l => l.trim().startsWith('|'));
    const headers = lines[0].split('|').map(s => s.trim()).filter(Boolean);
    const platforms = headers.slice(1);

    document.getElementById('tHead').innerHTML =
      '<th style="text-align:left;white-space:nowrap">IoTextra module</th>' +
      platforms.map(p => `<th style="min-width:100px">${p.replace(' + ', '<br>+ ')}</th>`).join('');

    const tBody = document.getElementById('tBody');
    tBody.innerHTML = '';

    for (let i = 2; i < lines.length; i++) {
      const cells = lines[i].split('|').map(s => s.trim()).filter(Boolean);
      if (cells.length < 2) continue;
      const module = cells[0];
      const tr = document.createElement('tr');

      const tdN = document.createElement('td');
      tdN.textContent = module;
      tr.appendChild(tdN);

      for (let j = 1; j <= platforms.length; j++) {
        const cell = cells[j] || '';
        const td = document.createElement('td');
        const platform = platforms[j - 1];
        if (cell.includes('Template-green') && cell.includes('http')) {
          const pfFile = PLATFORM_FILE[platform];
          const btn = document.createElement('button');
          btn.className = 'btn-tmpl';
          btn.textContent = 'Template';
          btn.onclick = () => onSelect(btn, module, platform, pfFile);
          td.appendChild(btn);
        } else if (cell.includes('🔶')) {
          td.innerHTML = '<span style="opacity:.4">🔶</span>';
        } else {
          td.innerHTML = '<span style="opacity:.2">🔲</span>';
        }
        tr.appendChild(td);
      }
      tBody.appendChild(tr);
    }
    setStatus('Table loaded — click a Template button to start', 'ok');
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}

async function onSelect(btn, module, platform, pfFile) {
  if (selBtn) selBtn.classList.remove('selected');
  btn.classList.add('selected');
  selBtn = btn;
  sel = { module, platform, pfFile };
  document.getElementById('selInfo').textContent = module + '  ·  ' + platform;

  const vsel = document.getElementById('versionSel');
  vsel.disabled = true;
  vsel.innerHTML = '<option>Loading versions…</option>';
  document.getElementById('genBtn').disabled = true;

  try {
    const repo = MODULE_REPO[module];
    const items = await ghAPI('repos/' + ORG + '/' + repo + '/contents/' + module);
    const versions = items
      .filter(i => i.type === 'dir' && i.name.startsWith('v'))
      .map(i => i.name).sort().reverse();
    if (!versions.length) { vsel.innerHTML = '<option>No versions found</option>'; return; }
    vsel.innerHTML = versions.map(v => `<option value="${v}">${v}</option>`).join('');
    vsel.disabled = false;
    document.getElementById('genBtn').disabled = false;
  } catch (e) {
    vsel.innerHTML = '<option>Error: ' + e.message + '</option>';
  }
}

async function generate() {
  if (!sel) return;
  const { module, platform, pfFile } = sel;
  const version = document.getElementById('versionSel').value;
  const repo = MODULE_REPO[module];

  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = 'Loading…';

  const body = document.getElementById('outputBody');
  body.innerHTML = '<div class="empty"><span class="spinner"></span><div class="empty-text">Reading from GitHub…</div></div>';

  try {
    const skuMd = await ghRaw(ORG + '/' + repo + '/main/' + module + '/SKU.md');
    const productName = skuMd.split('\n').find(l => l.trim()).trim().replace(/^#+\s*/, '').replace(/^SKU\s*\u2014\s*/i, '');
    const codeMatch = skuMd.match(/\n([0-9]{6})/);
    const productCode = codeMatch ? codeMatch[1] : '';
    const versionCode = version.replace(/^v\.?/, '').replace('.', '');
    const gLink = productCode ? 'https://makethingshappy.io/g' + productCode + versionCode : '';
    const mediaItems = await ghAPI('repos/' + ORG + '/' + repo + '/contents/' + module + '/' + version + '/media');
    const photoFile = mediaItems
      .filter(i => i.type === 'file' && !i.name.startsWith('placeholder'))
      .sort((a, b) => a.name.localeCompare(b.name))[0];
    const photoRaw = photoFile
      ? 'https://raw.githubusercontent.com/' + ORG + '/' + repo + '/main/' + module + '/' + version + '/media/' + photoFile.name
      : null;

    let tasmotaJson = null;
    if (pfFile) {
      const tmplMd = await ghRaw(IOTHOME + '/main/Tasmota_Templates/' + pfFile + '.md');
      const re = new RegExp('###\\s+IoTextra\\s+' + module.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\n```json\\n({[^\\n]+})\\n```');
      const jm = tmplMd.match(re);
      tasmotaJson = jm ? jm[1] : null;
    }

    const today = new Date().toISOString().split('T')[0];
    const typeSuffix = repo.split('-')[1];
    const linkSlug = productName.toLowerCase().replace(/\s+/g, '-');
    const filenameSugg = productName.toLowerCase().replace(/\s+/g, '_') + '_' + version.replace('.', '');

    const md = `---
date_added: ${today}
title: ${productName}
category: other
type: ${typeSuffix} Expansion Module
standard: global
link: https://makethingshappy.io/products/${linkSlug}
mlink: ${gLink}
image: /assets/device_images/${filenameSugg}.webp
template: '${tasmotaJson || 'NOT FOUND — check IoThome repo'}'
---`;

    body.innerHTML = '';

    if (photoRaw) {
      const pd = document.createElement('div');
      pd.className = 'block';
      pd.innerHTML = `<div class="block-header"><span>Photo — ${version}/media/</span><a href="${photoRaw}" target="_blank" style="color:var(--muted);font-size:10px;text-decoration:none">${photoFile.name} ↗</a></div>
        <div class="photo-wrap"><img src="${photoRaw}" alt="${productName}"><div class="photo-name">${photoFile.name}</div></div>`;
      body.appendChild(pd);
    }

    const mdBlock = document.createElement('div');
    mdBlock.className = 'block';
    const esc = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    mdBlock.innerHTML = `<div class="block-header"><span>blakadder — ${filenameSugg}</span><button class="copy-btn" id="copyBtn">Copy</button></div><pre id="mdOut">${esc}</pre>`;
    body.appendChild(mdBlock);

    document.getElementById('copyBtn').onclick = function() {
      navigator.clipboard.writeText(md).then(() => {
        this.textContent = '✓ Copied';
        setTimeout(() => this.textContent = 'Copy', 1800);
      });
    };

    if (!tasmotaJson) {
      const w = document.createElement('div');
      w.className = 'warn';
      w.textContent = '⚠ Tasmota JSON not found in IoThome for this platform.';
      body.appendChild(w);
    }

  } catch (e) {
    body.innerHTML = `<div style="background:var(--danger-bg);border:1px solid #5a2020;border-radius:8px;padding:14px;font-size:12px;color:var(--danger)">${e.message}</div>`;
  }

  btn.disabled = false; btn.textContent = 'Generate Blakadder entry';
}

loadTable();
</script>
</body>
</html>
