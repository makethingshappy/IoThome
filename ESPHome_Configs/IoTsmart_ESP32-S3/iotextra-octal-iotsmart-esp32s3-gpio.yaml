# IoTextra Octal 3.04 + IoTsmart ESP32-S3 2.01 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/ESP32-S3/v.2.01/host-map.yaml + IoTextra-Digital/Octal/v.3.04/host-map.yaml
# All channels active-low on the HOST line: input active = 0, output on = 0
# Requires SB2 closed (HOST AP4 -> RL1). With SB1 closed AP4 is TCA9534 INT: RL1 will not work.
esphome:
  name: octal-s3

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Waveshare ESP32-S3-Tiny on IoTsmart ESP32-S3: 4MB flash, 2MB PSRAM
psram:
  mode: quad

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C: IoTsmart ESP32-S3 2.01 SDA=GPIO16, SCL=GPIO15 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO16
  scl: GPIO15
  scan: true

binary_sensor:
  - {platform: gpio, name: "IN1", pin: {number: GPIO8,  inverted: true}}   # AP0
  - {platform: gpio, name: "IN2", pin: {number: GPIO9,  inverted: true}}   # AP1
  - {platform: gpio, name: "IN3", pin: {number: GPIO10, inverted: true}}   # AP2
  - {platform: gpio, name: "IN4", pin: {number: GPIO11, inverted: true}}   # AP3

switch:
  - {platform: gpio, name: "RL1", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 via SB2, relay K1
  - {platform: gpio, name: "RL2", pin: {number: GPIO5, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5, relay K2
  - {platform: gpio, name: "DO1", pin: {number: GPIO6, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6
  - {platform: gpio, name: "DO2", pin: {number: GPIO7, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7
