# IoTextra MOSFET2 3.02 + IoTsmart ESP32-S3 2.01 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/ESP32-S3/v.2.01/host-map.yaml + IoTextra-Digital/MOSFET2/v.3.02/host-map.yaml
# Outputs DO1..DO8: MOSFET, active-low on the HOST line (output on = 0)
# Status: not yet verified on hardware
esphome:
  name: mosfet2-s3

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Waveshare ESP32-S3-Tiny on IoTsmart ESP32-S3: 4MB flash, 2MB PSRAM
psram:
  mode: quad

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C: IoTsmart ESP32-S3 2.01 SDA=GPIO16, SCL=GPIO15 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO16
  scl: GPIO15
  scan: true

switch:
  - {platform: gpio, name: "DO1", pin: {number: GPIO8,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP0, group S
  - {platform: gpio, name: "DO2", pin: {number: GPIO9,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP1, group S
  - {platform: gpio, name: "DO3", pin: {number: GPIO10,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP2, group S
  - {platform: gpio, name: "DO4", pin: {number: GPIO11,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP3, group S
  - {platform: gpio, name: "DO5", pin: {number: GPIO4,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP4, group N
  - {platform: gpio, name: "DO6", pin: {number: GPIO5,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP5, group N
  - {platform: gpio, name: "DO7", pin: {number: GPIO6,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP6, group N
  - {platform: gpio, name: "DO8", pin: {number: GPIO7,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP7, group N
