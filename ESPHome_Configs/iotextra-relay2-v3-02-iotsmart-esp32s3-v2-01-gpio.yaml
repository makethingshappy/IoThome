# IoTextra Relay2 3.02 + IoTsmart ESP32-S3 2.01 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/ESP32-S3/v.2.01/host-map.yaml + IoTextra-Digital/Relay2/v3.02/host-map.yaml
# Outputs RL1..RL4: SPDT relays K1..K4, active-low on the HOST line (output on = 0)
# AP4..AP7 not used by the module (TCA9534 P4..P7 only)
# Status: not yet verified on hardware
esphome:
  name: relay2-iotsmart-s3

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Waveshare ESP32-S3-Tiny on IoTsmart ESP32-S3: 4MB flash, 2MB PSRAM
psram:
  mode: quad

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C: IoTsmart ESP32-S3 2.01 SDA=GPIO16, SCL=GPIO15 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO16
  scl: GPIO15
  scan: true

switch:
  - {platform: gpio, name: "RL1", pin: {number: GPIO8,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP0, K1
  - {platform: gpio, name: "RL2", pin: {number: GPIO9,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP1, K2
  - {platform: gpio, name: "RL3", pin: {number: GPIO10,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP2, K3
  - {platform: gpio, name: "RL4", pin: {number: GPIO11,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP3, K4
