# IoTextra Octal4 3.02 + IoTsmart ESP32-S3 2.01 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/ESP32-S3/v.2.01/host-map.yaml + IoTextra-Digital/Octal4/v.3.02/host-map.yaml
# Inputs DI1..DI4: ISO1211, active-high on the HOST line (input active = 1)
# Relays K1..K4 (terminals RS1..RS4): active-low on the HOST line (relay on = 0)
# Requires SB6 closed (HOST AP4 -> K1). With SB5 closed AP4 is TCA9534 INT: K1 will not work.
# Status: not yet verified on hardware
esphome:
  name: octal4-iotsmart-s3

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Waveshare ESP32-S3-Tiny on IoTsmart ESP32-S3: 4MB flash, 2MB PSRAM
psram:
  mode: quad

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C: IoTsmart ESP32-S3 2.01 SDA=GPIO16, SCL=GPIO15 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO16
  scl: GPIO15
  scan: true

binary_sensor:
  - {platform: gpio, name: "DI1", pin: {number: GPIO8}}    # AP0
  - {platform: gpio, name: "DI2", pin: {number: GPIO9}}    # AP1
  - {platform: gpio, name: "DI3", pin: {number: GPIO10}}   # AP2
  - {platform: gpio, name: "DI4", pin: {number: GPIO11}}   # AP3

switch:
  - {platform: gpio, name: "K1", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 via SB6, RS1
  - {platform: gpio, name: "K2", pin: {number: GPIO5, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5, RS2
  - {platform: gpio, name: "K3", pin: {number: GPIO6, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6, RS3
  - {platform: gpio, name: "K4", pin: {number: GPIO7, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7, RS4
